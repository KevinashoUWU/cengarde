# cengarde VPS: forwarding for the tunnel and larger socket buffers.
net.ipv4.ip_forward = 1
net.core.rmem_max = 26214400
net.core.wmem_max = 26214400
# a burst of the routers' links at once waits here, not dropped (as
# OpenMPTCProuter's VPS, story 029)
net.core.netdev_max_backlog = 10000
# the protocontroller's TCP to the destinations: a live stream idle between
# frames goes on at its window, not from slow start again
net.ipv4.tcp_slow_start_after_idle = 0
