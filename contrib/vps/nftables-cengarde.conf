# A drop-in for nftables.service, installed by install.sh only when that
# service is enabled: /etc/nftables.conf starts with "flush ruleset", which
# also removes the iptables rules of cengarde-nat, and stopping nftables
# flushes everything. After each start, reload and stop, cengarde-nat sync
# puts them back (nothing while cengarde-nat is down). "-": a failure here
# never fails the firewall.
[Service]
ExecStartPost=-/usr/local/sbin/cengarde-nat sync
ExecReload=-/usr/local/sbin/cengarde-nat sync
ExecStopPost=-/usr/local/sbin/cengarde-nat sync
