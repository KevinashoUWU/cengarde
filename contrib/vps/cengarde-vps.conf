# cengarde on a VPS: the engine never talks to 169.254.0.0/16, where the
# provider's metadata service lives, and its user data hold the pairing
# secret: even a compromised engine cannot read them. install.sh puts this
# drop-in in /etc/systemd/system/cengarde.service.d/vps.conf. It is not in
# the generic unit because a client on another cloud may need a link-local
# resolver such as 169.254.169.253.
[Service]
IPAddressDeny=169.254.0.0/16
