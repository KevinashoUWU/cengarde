# cengarde server (the VPS). Check with: cengarde -t -c server.conf

mode = server

# Same shared secret as the clients.
key = REPLACE_WITH_THE_OUTPUT_OF_cengarde_genkey

# Where clients connect. "*" is dual-stack (IPv4 only if the kernel has no
# IPv6). On a wildcard ("*" or 0.0.0.0) each reply leaves from the address
# its client sends to, so any address of the VPS works, including one added
# while running (a reserved IP, IPv6). A single address listens on that one.
listen = *:59402

# The tunnel: one TUN device for every router, with the server's address
# in it. A router's packets come out of it, and what the kernel routes into
# it goes to the router whose tun_route holds the destination (one router
# without tun_route: everything). Not encrypted: authenticated by the MAC.
tunnel = native
#tun = cg0
tun_addr = 10.79.0.1/16
#tun_mtu = 1420
#tun_route = 10.79.0.2/32 192.168.1.0/24

# Listen sockets on that port, one per client link id (link 0 on lane 0,
# and so on), plus one for anything that is not cengarde protocol 4: the
# copies of a packet wait in different queues, so a stall rarely loses
# all of them, and a slow path fills only its own send buffer. auto is 8;
# 1 is a single socket. Changing it restarts the server.
#lanes = auto

# Receive buffer of each socket (bytes; the kernel doubles it). The
# receiving sockets share at most half of net.ipv4.udp_mem's pressure
# threshold, so on a small VPS each may get less: "cengarde -t" says how
# much, and the status shows rcvbuf_capped.
#rcvbuf = 4194304

#max_sessions = 64
#session_timeout_ms = 180000
#path_timeout_ms = 30000
#status_file = /tmp/cengarde.json
#control_socket = /var/run/cengarde/cengarde.sock

# IP pass: "on" or "off" goes to this file as the newest client session asks
# for it; something else applies it (contrib/vps: cengarde-passthrough.path).
#passthrough_file = /run/cengarde/passthrough

# Link health for the download, decided here from the delays each client
# reports (same keys and defaults as on the client, which decides for its
# upload; see examples/client.conf).
#mute_behind_ms = 150
#unmute_behind_ms = 120
#mute_settle_ms = 2000
#min_active_links = 2
#mute_trickle = 0

# Reordering and splitting (docs/historias/012), as on the client for the
# reordering of each session's upload (see examples/client.conf; the held
# packets of every session share reorder_pool_kb). split here is for the
# download: client (the default) splits it only when the client asks and
# reorders, off never, force always and evenly (the lab). Experimental, as
# on the client. The weights of the download come from the client's [link]
# sections, in its probes; split_spread_ms keeps the paths whose download
# delay is more than that behind the fastest out of the share, and
# split_spread_copy says whether those carry a copy of every packet (yes) or
# only what goes to every path (no), as on the client (no by default with
# governor).
#reorder = yes
#reorder_max_wait_ms = 200
#reorder_dup_wait_ms = 0
#reorder_margin_ms = 10
#reorder_bypass = 128
#reorder_pool_kb = 8192
#split = client
#split_small = 256
#split_spread_ms = 30
#split_spread_copy = yes
# governor (experimental): the download split's weights from each path's
# own queue, as on the client for the upload (then the client's weights
# are not used, but 0 is kept).
#governor = no
#governor_target_ms = 20
#governor_window_ms = 10000
# capacity_weights (experimental): the download split's weights from each
# path's capacity, what the client says it received on it, as on the
# client for the upload.
#capacity_weights = no
# split_eta (experimental): the download split by expected arrival, as on
# the client for the upload.
#split_eta = no

# Latency knobs, as on the client.
#busy_poll_us = 0
#cpu = 1
#rt_priority = 10

# Several routers on one server: a [client NAME] section each, instead of
# the key above (and instead of tun_route and passthrough_file, which go
# in each section and to forward_file). A reload adds, changes, turns
# off or removes a router without touching the others' sessions; see
# "Varios routers por servidor" in engine/README.md.
#forward_file = /var/lib/cengarde/forward
#
#[client alpha]
#key = REPLACE_WITH_ALPHAS_KEY
# Its address in the tunnel and the networks behind it: what the server's
# TUN sends to it (required, no prefix in two sections).
#tun_route = 10.79.12.34/32 192.168.1.0/24
#label = Rooftop
# no: its probes get a refusal and its sessions close.
#enabled = yes
# no: it never gets IP pass, the whole range, even if it asks.
#passthrough = yes
# Ports of this server forwarded to the router: PROTO:PORT[-PORT][=TO], PROTO
# tcp, udp or both; TO is the router's port (the same by default).
#forward = tcp:9000=22 udp:5000-5010
