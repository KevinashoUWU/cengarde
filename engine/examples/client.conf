# cengarde client (the box with several uplinks, e.g. a Raspberry Pi or an
# OpenWrt router). Check with: cengarde -t -c client.conf

mode = client

# Shared secret, identical on client and server. Generate with: cengarde genkey
key = REPLACE_WITH_THE_OUTPUT_OF_cengarde_genkey

# Where the local WireGuard sends: set the WireGuard peer Endpoint to this.
listen = 127.0.0.1:59401

# The cengarde server: an ordered list of up to 8 entries, IPv4, [IPv6] or
# names (a name stands for its addresses, at most 4 of each family). Each
# uplink sends to the first entry of a family it has an address of, one
# family per uplink. When the server does not answer there for
# server_failover_ms, the uplink tries the next entry, and stays wherever
# the server answers. A name is looked up by cengarde itself, through the
# uplinks, again as its TTL says (30 s to 15 min) and at once when the server
# stops answering on its addresses: a server with a dynamic IP works (see
# README.md, "Nombres del servidor"). /etc/hosts goes first.
server = 203.0.113.10:59402 [2001:db8::4]:59402
#server = home.example.net:59402

# DNS servers every uplink may ask for the names above, after its own
# ([link] resolver); these are the default ones. Empty: none.
#resolver = 1.1.1.1 9.9.9.9 [2606:4700:4700::1111] [2620:fe::fe]

# How long an uplink waits for a reply before trying its next server
# address; 0: never. At least 3 x probe_idle_ms.
#server_failover_ms = 10000

# Uplinks to use (fnmatch patterns). lo, wg*, docker*, veth*, br-*, tun*,
# tap*, ifb* and dummy* are always excluded; add more with "exclude".
interfaces = eth1.* wwan*
#exclude = eth1.99

# Path probes measure RTT and each link's delay and keep NAT mappings open:
# every probe_interval_ms while the tunnel carries traffic, every
# probe_idle_ms while it is idle. A link whose last 3 probes are unanswered
# for 2 RTT + 1 s stops carrying payload until it answers again.
#probe_interval_ms = 100
#probe_idle_ms = 1000

# Link health. This end decides for the upload, the server for the download.
# A link that stays more than mute_behind_ms behind the fastest active link
# for mute_settle_ms is muted: it keeps its socket and its probes but
# carries no payload. It comes back after staying within unmute_behind_ms
# for twice the settle time (longer after unmutes that did not last). At
# least min_active_links links always carry everything.
# mute_behind_ms = 0 turns muting off.
#mute_behind_ms = 150
#unmute_behind_ms = 120
#mute_settle_ms = 2000
#min_active_links = 2
#mute_trickle = 0        # a muted link still carries 1 packet in N (0: none)

# Reordering and splitting (docs/historias/012). Parsed and checked, but
# nothing uses them yet. With reorder, the end that receives puts the
# verified packets back in sequence before WireGuard: a packet that arrives
# ahead of a missing one waits at most reorder_max_wait_ms, less once the
# missing one is due on the slowest link (its delay + reorder_margin_ms).
# Where nothing is split the wait is reorder_dup_wait_ms (0: nothing is held,
# delivery order as before; at most reorder_max_wait_ms). WireGuard data
# datagrams of up to reorder_bypass bytes (keepalives, empty ACKs) and the
# handshakes are delivered at once. reorder_pool_kb is the memory for the
# packets it holds (restart-only).
#reorder = yes
#reorder_max_wait_ms = 200
#reorder_dup_wait_ms = 0
#reorder_margin_ms = 10
#reorder_bypass = 128
#reorder_pool_kb = 8192

# split (EXPERIMENTAL) shares the upload out among the links by weight
# instead of copying every packet to all of them: off (the default), on (the
# field mode: only once the server says it reorders, and it asks the server
# to split the download too) or force (the lab: no questions asked). It
# does worse than redundancy without the steps that follow it in the plan: a
# link that dies keeps its share until it is detected, the slowest link sets
# the latency, and weights above what a link holds fill its queue.
# Datagrams of up to split_small bytes, and handshakes, still go to all links.
#split = off
#split_small = 256

# Latency knobs (docs/historias/006). busy_poll_us keeps polling for that
# long after traffic instead of sleeping: lower latency, more CPU. cpu pins
# the process to one CPU; rt_priority (1-99) runs it with SCHED_FIFO.
#busy_poll_us = 0
#cpu = 2
#rt_priority = 10

# Link sockets (docs/historias/011). legacy, the default, reads them in one
# loop as 0.4 did; on gives each link a thread of its own (at most 8: more
# links share them), so a stalled link or thread no longer holds the others
# back, at the cost of more CPU at low rates; off runs the same per-link
# structure in one thread. auto is legacy until the threads are measured on
# the Pi. With on, cpu pins the main thread, "cpu" in a [link] section that
# link's thread, and rt_priority applies to all of them. io_queue: entries
# of each queue to a link thread (64-1024, a power of two). Restart-only.
#link_threads = legacy
#io_queue = 256

# Send buffer of each uplink socket in bytes (kernel default if unset): how
# much a slow uplink can queue locally before it drops its own copies.
#sndbuf = 262144

# JSON snapshot for a web UI or scripts, rewritten every status_interval_ms.
#status_file = /tmp/cengarde.json

# Control socket for "cengarde ctl" (status, links, pause a link, reload).
# SIGHUP or "cengarde ctl reload" applies changes to this file in place.
#control_socket = /var/run/cengarde/cengarde.sock

# IP pass: ask the server to forward its public ports to this site (yes) or
# to stop (no); left out, this client asks nothing. The server applies it
# only with passthrough_file set (see examples/server.conf).
#passthrough = yes

# Per-interface settings. A [link] section enables that interface even if it
# does not match "interfaces".
[link eth1.10]
label = WOM

[link eth1.20]
label = Entel

[link eth1.30]
label = Claro

[link eth1.40]
label = Movistar
# server = 203.0.113.20:59402 203.0.113.10:59402   # a server list for this link only
# resolver = 192.168.8.1                            # its carrier's DNS, asked first
# enabled = no
# weight = 1   # its share with split (0-1000); 0: it carries a copy of every packet
