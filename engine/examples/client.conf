# cengarde client (the box with several uplinks, e.g. a Raspberry Pi or an
# OpenWrt router). Check with: cengarde -t -c client.conf

mode = client

# Shared secret, identical on client and server. Generate with: cengarde genkey
key = REPLACE_WITH_THE_OUTPUT_OF_cengarde_genkey

# Where the local WireGuard sends: set the WireGuard peer Endpoint to this.
listen = 127.0.0.1:59401

# The cengarde server. Several addresses (or a name with A and AAAA records)
# let each uplink use the family it has an address for.
server = vps.example.com:59402

# Uplinks to use (fnmatch patterns). lo, wg*, docker*, veth*, br-*, tun*,
# tap*, ifb* and dummy* are always excluded; add more with "exclude".
interfaces = eth1.* wwan*
#exclude = eth1.99

# Path probes measure RTT and each link's delay and keep NAT mappings open:
# every probe_interval_ms while the tunnel carries traffic, every
# probe_idle_ms while it is idle. A link whose last 3 probes are unanswered
# for 2 RTT + 1 s stops carrying payload until it answers again.
#probe_interval_ms = 100
#probe_idle_ms = 1000

# Link health. This end decides for the upload, the server for the download.
# A link that stays more than mute_behind_ms behind the fastest active link
# for mute_settle_ms is muted: it keeps its socket and its probes but
# carries no payload. It comes back after staying within unmute_behind_ms
# for twice the settle time (longer after unmutes that did not last). At
# least min_active_links links always carry everything.
# mute_behind_ms = 0 turns muting off.
#mute_behind_ms = 150
#unmute_behind_ms = 120
#mute_settle_ms = 2000
#min_active_links = 2
#mute_trickle = 0        # a muted link still carries 1 packet in N (0: none)

# Latency knobs (docs/historias/006). busy_poll_us keeps polling for that
# long after traffic instead of sleeping: lower latency, more CPU. cpu pins
# the process to one CPU; rt_priority (1-99) runs it with SCHED_FIFO.
#busy_poll_us = 0
#cpu = 2
#rt_priority = 10

# Send buffer of each uplink socket in bytes (kernel default if unset): how
# much a slow uplink can queue locally before it drops its own copies.
#sndbuf = 262144

# JSON snapshot for a web UI or scripts, rewritten every status_interval_ms.
#status_file = /tmp/cengarde.json

# Per-interface settings. A [link] section enables that interface even if it
# does not match "interfaces".
[link eth1.10]
label = WOM

[link eth1.20]
label = Entel

[link eth1.30]
label = Claro

[link eth1.40]
label = Movistar
# server = 203.0.113.20:59402   # a different server address for this link only
# enabled = no
