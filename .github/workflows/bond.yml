name: Bonding lab

# Step 0 of story 012 (bench/lab.d/bond.sh): real WireGuard through cengarde
# and real transport inside it (iperf3 with Cubic and BBR, and a QUIC sender,
# bench/quicperf.py on aioquic; up and down) with ping under load, over veth
# links shaped with netem: equal and unequal links, reordering, a link that
# dies, a Starlink-like pattern, LTE delay spikes and a deep queue, plus the
# best link alone. It is the baseline that the bonding of Fase 5 has to beat.
# It judges no speed: it fails only when the plumbing does (no netem, no
# aioquic, no handshake, no traffic). The table (median and spread when there
# are repetitions) goes to the job summary and the JSON lines to an artifact.
#
# How long it takes, on a shared runner: about 3 minutes to install and build,
# and per repetition of all the cases about 16 (10 variants of cases, each
# with 2 directions x 3 congestion controls; 10 s runs, 31 s in starlink15).
# So the push and pull_request runs (one repetition) take about 19 minutes,
# and repetitions=10 with all the cases about 165: the timeout leaves room for
# that, and the "Estimate" step refuses what would not fit (more seconds or
# repetitions): then pick cases, e.g. "equal reorder150 starlink15" takes about
# 80 minutes for 10 repetitions.

on:
  push:
    paths:
      - 'engine/**'
      - 'bench/**'
      - '.github/workflows/bond.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'bench/**'
      - '.github/workflows/bond.yml'
  workflow_dispatch:
    inputs:
      repetitions:
        description: 'Runs per case, direction and congestion control (10 with all the cases takes about 165 minutes)'
        default: '1'
      seconds:
        description: 'Seconds per run (starlink15 takes at least 31)'
        default: '10'
      cases:
        description: 'Cases, separated by spaces (empty: all of them)'
        default: ''

permissions:
  contents: read

jobs:
  bond:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - name: Estimate the run time
        env:
          N: ${{ inputs.repetitions || '1' }}
          S: ${{ inputs.seconds || '10' }}
          CASES: ${{ inputs.cases }}
        run: |
          case "$N$S" in *[!0-9]*) echo "repetitions and seconds are numbers"; exit 1 ;; esac
          # Per case: its variants (equal and het also run their best link alone)
          # x 6 runs (2 directions x 3 congestion controls) x (seconds + 3 of
          # starting and draining) + 6 of building the lab. Keep the default
          # cases in step with bench/lab.d/bond.sh.
          secs=0
          for c in ${CASES:-equal het reorder50 reorder150 linkdeath starlink15 ltespike deepq}; do
            dur=$S
            case "$c" in starlink15*) [ "$S" -lt 31 ] && dur=31 ;; esac
            v=1
            case "$c" in equal | het) v=2 ;; esac
            secs=$((secs + v * (6 * (dur + 3) + 6)))
          done
          min=$(((secs * N + 59) / 60 + 3))
          echo "Estimated run time: $min minutes (the job times out at 200; this refuses more than 180)"
          [ "$min" -le 180 ] || { echo "Too long: pick fewer cases, repetitions or seconds"; exit 1; }
      - uses: actions/checkout@v4
      - name: Install iperf3, wireguard-tools and aioquic; load WireGuard, BBR and netem
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends iperf3 wireguard-tools python3-pip
          # --ignore-installed: the runner has python3-cryptography from apt, which pip cannot uninstall.
          # System-wide, so that "sudo python3 -I bench/quicperf.py" finds it.
          sudo python3 -m pip install --break-system-packages --ignore-installed --no-cache-dir 'aioquic==1.2.0'
          for m in wireguard tcp_bbr sch_netem; do
            sudo modprobe "$m" || {
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "linux-modules-extra-$(uname -r)" &&
                sudo modprobe "$m"
            }
          done
      - name: Build the lab (udpgen and cengarde)
        run: sudo ENGINE=c bench/lab.sh build
      - name: Bonding lab
        env:
          N: ${{ inputs.repetitions || '1' }}
          S: ${{ inputs.seconds || '10' }}
          CASES: ${{ inputs.cases }}
        run: |
          case "$N$S" in *[!0-9]*) echo "repetitions and seconds are numbers"; exit 1 ;; esac
          set -- RUN="$RUNNER_TEMP/bond" BOND_NEED_NETEM=1 BOND_NEED_QUIC=1 BOND_N="$N" BOND_S="$S"
          [ -n "$CASES" ] && set -- "$@" BOND_CASES="$CASES"
          sudo "$@" bench/lab.sh bond
      - name: Table to the job summary
        if: always()
        run: |
          {
            echo "## Bonding lab: today's redundancy and the best link alone"
            echo
            cat "$RUNNER_TEMP/bond/bond.md" 2>/dev/null || echo "(no table)"
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bond
          path: |
            ${{ runner.temp }}/bond/bond.jsonl
            ${{ runner.temp }}/bond/bond.md
          if-no-files-found: warn
